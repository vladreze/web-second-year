<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Розділ 7 - Події в DOM</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
      }
      form {
        margin-bottom: 20px;
        display: flex;
        gap: 10px;
      }
      ul {
        list-style: none;
        padding: 0;
        width: 300px;
      }
      li {
        background: #e0f7fa;
        padding: 10px;
        margin-bottom: 5px;
        border-radius: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .delete-btn {
        background: #ff5252;
        color: white;
        border: none;
        padding: 4px 8px;
        border-radius: 3px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h2>Список задач із формами та подіями</h2>

    <form id="todo-form">
      <input
        type="text"
        id="task-input"
        placeholder="Введіть задачу..."
        required
      />
      <button type="submit">Додати</button>
    </form>

    <ul id="task-list">
      <li>
        <span>Вивчити події DOM</span>
        <button class="delete-btn">Видалити</button>
      </li>
    </ul>

    <script src="script.js"></script>
  </body>
</html>
